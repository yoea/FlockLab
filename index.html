<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05070f" />
<title>FlockLab · 涌现模拟</title>
<style>
  :root {
    --ink: #dce9ff;
    --dim: #7e93b5;
    --line: rgba(126, 170, 235, 0.18);
    --glass: rgba(9, 15, 29, 0.66);
    --accent: #63e6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05070f; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; touch-action: none; }

  .glass {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  #brand { position: fixed; left: 22px; top: 20px; z-index: 5; }
  #brand .card-title {
    font-size: 20px; font-weight: 650; letter-spacing: 0.06em;
    background: linear-gradient(92deg, #8ff3ff 0%, #a6b4ff 48%, #ff8dc2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #brand .card-body p { margin: 5px 0 0; font-size: 11px; color: var(--dim); letter-spacing: 0.08em; }

  #audioBtn, #uiBtn {
    position: fixed; right: 18px; top: 18px; z-index: 8;
    width: 36px; height: 36px; padding: 0; display: grid; place-items: center;
    cursor: pointer; color: var(--ink); border-radius: 50%;
    border: 1px solid rgba(99, 230, 255, 0.38);
    background: rgba(11, 26, 43, 0.82);
    transition: transform .18s ease, border-color .25s ease, box-shadow .25s ease, opacity .35s ease;
  }
  #audioBtn:hover { transform: translateY(-1px); border-color: rgba(99, 230, 255, 0.85); }
  #audioBtn.live { border-color: rgba(120, 255, 190, 0.52); box-shadow: 0 0 16px rgba(70, 230, 175, 0.15); }
  #audioBtn svg { width: 19px; height: 19px; }
  #audioBtn .spk { fill: currentColor; }
  #audioBtn .waves, #audioBtn .cross {
    fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #audioBtn.live .cross, #audioBtn:not(.live) .waves { display: none; }

  #uiBtn { right: 62px; z-index: 9; }
  #uiBtn svg { width: 18px; height: 18px; }
  #uiBtn .eye, #uiBtn .pupil {
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #uiBtn .pupil { fill: currentColor; stroke: none; }
  #uiBtn .slash {
    fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;
    display: none;
  }
  #uiBtn.off .eye, #uiBtn.off .pupil { opacity: 0.35; }
  #uiBtn.off .slash { display: block; }

  /* 闲置数秒后隐藏光标，任何鼠标移动 / 按键 / 触摸都会立刻恢复 */
  body.cursor-idle, body.cursor-idle * { cursor: none !important; }

  /* 隐藏全部界面后，小眼睛自身也会淡出；晃动鼠标或按键再显现 */
  #uiBtn.faded { opacity: 0; pointer-events: none; }

  /* 演示模式：只保留切换按钮，其余界面全部隐藏 */
  body.ui-hidden #brand,
  body.ui-hidden #hud,
  body.ui-hidden #audioBtn,
  body.ui-hidden .lil-gui.root { display: none !important; }

  /* 可折叠玻璃卡片：标题可点，正文不拦截画布拖拽 */
  .card { pointer-events: auto; padding: 0; }
  .card-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 11px 15px; border: 0; background: none;
    color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .card-head .chev { color: var(--dim); font-size: 12px; transition: transform .2s ease; }
  .card.collapsed .chev { transform: rotate(-90deg); }
  .card-body { padding: 0 15px 13px; pointer-events: none; }
  .card.collapsed .card-body { display: none; }

  #hud {
    position: fixed; left: 22px; bottom: 22px; z-index: 5;
    min-width: 252px; font-variant-numeric: tabular-nums;
  }
  #hud .card-title { font-size: 12px; color: var(--dim); letter-spacing: 0.12em; }
  .hud-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px; font-size: 11px; line-height: 2.0;
  }
  .hud-row .k { color: var(--dim); letter-spacing: 0.08em; }
  .hud-row .v { color: var(--ink); font-weight: 600; }
  .bar {
    position: relative; width: 92px; height: 4px; border-radius: 4px;
    background: rgba(150, 180, 230, 0.16); overflow: hidden;
  }
  .bar > i {
    position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, #4fd8ff, #a78bfa, #ff77b5);
    transition: width .12s linear;
  }
  .dot {
    display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: #4a5c78; transition: background .12s, box-shadow .12s;
  }
  .dot.sprint { background: #ffd36e; box-shadow: 0 0 10px #ffd36e; }
  .dot.pred { background: #ff6b3d; box-shadow: 0 0 10px #ff6b3d; }
  .dot.birth { background: #7dff9a; box-shadow: 0 0 10px #7dff9a; }

  #intro {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(5, 7, 15, 0.35) 0%, rgba(5, 7, 15, 0.86) 75%);
    transition: opacity .55s ease, visibility .55s ease;
  }
  #intro.hidden { opacity: 0; visibility: hidden; }
  #intro .card { max-width: 500px; padding: 34px 38px 30px; text-align: center; }
  #intro h2 {
    margin: 0 0 10px; font-size: 26px; font-weight: 650; letter-spacing: 0.1em;
    background: linear-gradient(92deg, #8ff3ff, #ff8dc2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #intro .sub { margin: 0 0 22px; font-size: 12px; color: var(--dim); letter-spacing: 0.14em; }
  #intro p { margin: 0 0 24px; font-size: 13px; line-height: 1.9; color: #b8c8e2; }
  #intro em { color: var(--accent); font-style: normal; }
  #startBtn {
    cursor: pointer; padding: 12px 30px; font-size: 14px; letter-spacing: 0.12em;
    color: #06121c; font-weight: 650; border: 0; border-radius: 999px;
    background: linear-gradient(96deg, #7cf0ff, #b6a8ff 60%, #ff9ccb);
    box-shadow: 0 8px 30px rgba(120, 200, 255, 0.24);
    transition: transform .18s ease, filter .18s ease;
  }
  #startBtn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  #intro .foot { margin-top: 18px; font-size: 10px; color: #5d7090; letter-spacing: 0.08em; }

  #error {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: #05070f; color: #ffb4b4; font-size: 14px; text-align: center; line-height: 1.8;
  }

  .lil-gui {
    --background-color: rgba(9, 15, 29, 0.82);
    --widget-color: rgba(46, 66, 100, 0.85);
    --hover-color: rgba(64, 92, 138, 0.95);
    --focus-color: rgba(78, 118, 174, 0.95);
    --number-color: #7fe9ff;
    --string-color: #ffb3d4;
    --font-size: 11px;
    --title-background-color: rgba(16, 26, 45, 0.92);
    --text-color: #dce9ff;
    z-index: 7 !important;
  }
  .lil-gui.root { margin-top: 76px; margin-right: 18px; }

  /* 触控屏：放大所有可点区域，面板限高可滚动，避免挡住群体 */
  body.touch #audioBtn, body.touch #uiBtn { width: 44px; height: 44px; }
  body.touch #uiBtn { right: 70px; }
  body.touch #startBtn { min-height: 48px; padding: 14px 34px; }
  body.touch .card-head { min-height: 44px; }
  body.touch .lil-gui {
    --font-size: 13px;
    --widget-height: 26px;
    --title-height: 32px;
    --slider-knob-width: 10px;
    --padding: 7px;
    --spacing: 6px;
    --name-width: 52%;
  }
  body.touch .lil-gui.root {
    max-height: 62vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  body.touch .lil-gui .controller { min-height: 30px; }
  body.touch .lil-gui .controller input,
  body.touch .lil-gui .controller .slider { touch-action: none; }

  @media (max-width: 720px) {
    #brand { left: 12px; top: 12px; }
    #hud { left: 12px; bottom: 12px; min-width: 0; }
    #audioBtn { right: 10px; top: 10px; }
    #uiBtn { right: 54px; top: 10px; }
    body.touch #uiBtn { right: 62px; }
    .lil-gui.root { margin-top: 58px; margin-right: 6px; }
  }
</style>
</head>
<body>
  <div id="scene"></div>

  <div id="brand" class="glass card">
    <button class="card-head" type="button" aria-expanded="true">
      <span class="card-title">FLOCKLAB</span><span class="chev">▾</span>
    </button>
    <div class="card-body"><p id="brandSub">二维平面 · 方向个体 · GPU 渲染</p></div>
  </div>

  <button id="audioBtn" class="muted" type="button" title="开启声音" aria-label="开启声音">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="spk" d="M4 9h4l5-4v14l-5-4H4z" />
      <path class="waves" d="M16.5 9.2c1.1 1.1 1.1 4.5 0 5.6M19.4 6.6c2.4 2.8 2.4 8 0 10.8" />
      <path class="cross" d="M17 9.5l5 5M22 9.5l-5 5" />
    </svg>
  </button>

  <button id="uiBtn" type="button" title="隐藏所有界面" aria-label="隐藏所有界面">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="eye" d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z" />
      <circle class="pupil" cx="12" cy="12" r="2.4" />
      <path class="slash" d="M4.5 4.5l15 15" />
    </svg>
  </button>

  <div id="hud" class="glass card">
    <button class="card-head" type="button" aria-expanded="true">
      <span class="card-title">实时状态</span><span class="chev">▾</span>
    </button>
    <div class="card-body">
      <div class="hud-row"><span class="k">个体数量</span><span class="v"><span id="hCount">300</span> <span style="color:#ff8a5c">◆<span id="hPred">1</span></span></span></div>
      <div class="hud-row"><span class="k">聚集密度 ρ</span><span class="bar"><i id="hDensityBar"></i></span></div>
      <div class="hud-row"><span class="k">温度 T ∝ v²</span><span class="v" id="hTemp">0.00</span></div>
      <div class="hud-row"><span class="k">气压 P = ρT</span><span class="v" id="hPress">0.00</span></div>
      <div class="hud-row"><span class="k">音效 逃逸 / 被吃 / 新生</span><span class="v"><span class="dot" id="hSprintFx"></span><span class="dot" id="hPredFx"></span><span class="dot" id="hBirthFx"></span></span></div>
      <div class="hud-row"><span class="k">爆发中 / 恢复中</span><span class="v" id="hSprint">0 / 0</span></div>
      <div class="hud-row"><span class="k">帧率</span><span class="v" id="hFps">— FPS</span></div>
    </div>
  </div>

  <div id="intro">
    <div class="card glass">
      <h2>FLOCKLAB</h2>
      <p class="sub">二维平面 · 涌现行为 · 交互模拟</p>
      <p>每个箭头只遵循<em>分离 · 对齐 · 聚合</em>三条规则。开启声音后，加速逃逸、被吃掉与新生时会有提示音。</p>
      <button id="startBtn">进入模拟</button>
    </div>
  </div>

  <div id="error"></div>

  <script type="module">
    const fail = (msg) => {
      const el = document.getElementById('error');
      el.style.display = 'flex';
      el.textContent = msg;
    };

    // 多 CDN 回退：业务代码仍只有这一个文件。
    async function loadModule(urls) {
      let last;
      for (const url of urls) {
        try { return await import(/* @vite-ignore */ url); }
        catch (e) { last = e; }
      }
      throw last;
    }

    let THREE, GUI;
    try {
      THREE = await loadModule([
        'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js',
        'https://unpkg.com/three@0.160.1/build/three.module.js'
      ]);
      const guiMod = await loadModule([
        'https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.js',
        'https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js'
      ]);
      GUI = guiMod.GUI || guiMod.default;
    } catch (e) {
      fail('依赖加载失败，请检查网络后刷新页面。\n' + (e && e.message ? e.message : e));
      throw e;
    }

    // 触控屏检测：混合设备（有触摸屏但鼠标为主）也算进去
    const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
    if (isTouch) document.body.classList.add('touch');

    // 所有玻璃卡片标题可点击折叠；默认全部展开。
    for (const head of document.querySelectorAll('.card > .card-head')) {
      head.addEventListener('click', () => {
        const card = head.closest('.card');
        card.classList.toggle('collapsed');
        head.setAttribute('aria-expanded', String(!card.classList.contains('collapsed')));
      });
    }

    // ---------------------------------------------------------------- 参数
    const params = {
      count: 300,
      separation: 2.05,
      alignment: 1.1,
      cohesion: 0.7,
      perception: 6.0,
      separationRange: 2.9,
      flow: 1.3,
      maxSpeed: 9.0,
      minSpeed: 2.2,
      boundary: 35,
      arrowSize: 0.2,
      master: 0.38,
      enabled: false,
      paused: false,
      // 捕食者：标准 Reynolds pursuit + 预测逃逸模型
      predatorOn: true,
      predatorCount: 1,
      fleeWeight: 2.6,
      fleeRange: 7.0,
      predict: 0.6,
      chaseWeight: 1.5,
      predSpeed: 14.5,
      lockTime: 1.5,
      feedCooldown: 3.0,
      infoCascade: true,
      // 逃逸爆发：白肌式短时冲刺，体力耗尽后必须恢复，不能连续多次爆发
      sprintFactor: 1.6,
      sprintDuration: 1.2,
      sprintRecovery: 5.0
    };
    const MAX_N = 1200;
    const MAX_P = 10;
    let activeCount = params.count;
    let activeP = params.predatorCount;

    // 高速缓存：位置/速度数组直接作为 GPU 实例属性，CPU 只更新数值，不再算矩阵。
    const pos = new Float32Array(MAX_N * 3);
    const vel = new Float32Array(MAX_N * 3);
    // 渲染用速度：对物理速度做低通滤波，只影响箭头朝向，不改变 Boids 动力学。
    const rVel = new Float32Array(MAX_N * 3);
    const acc = new Float32Array(MAX_N * 3);
    const col = new Float32Array(MAX_N * 3);
    const siz = new Float32Array(MAX_N);
    const neighbors = new Uint16Array(MAX_N);
    const fleeDir = new Float32Array(MAX_N * 3);   // 当前帧逃逸力方向
    const prevFlee = new Float32Array(MAX_N * 3);  // 上一帧逃逸力，用于信息级联（传播带一帧延迟）
    const fleeing = new Uint8Array(MAX_N);
    const caught = new Uint8Array(MAX_N);           // 1=已被捕食，等待重新出生
    const respawnAt = new Float64Array(MAX_N);      // 重新出生的时间戳（ms），0 表示无需等待
    const birthAt = new Float64Array(MAX_N);       // 新生时间戳：-Infinity 表示普通个体
    birthAt.fill(-Infinity);
    // 逃逸体力：1=满，0=耗尽。爆发结束后按 sprintRecovery 秒恢复，未回满不能再爆发。
    const stamina = new Float32Array(MAX_N);
    stamina.fill(1);
    const sprintUntil = new Float64Array(MAX_N);   // 爆发到期时间（ms）
    const cruiseBias = new Float32Array(MAX_N);    // 无威胁时的巡航速度比例，缓慢向群体节奏靠拢
    cruiseBias.fill(0.42);
    let sprintCount = 0, sprintingCount = 0;

    // 捕食者独立数组，与 boid 数组完全隔离，不影响元素数量语义。
    const predPos = new Float32Array(MAX_P * 3);
    const predVel = new Float32Array(MAX_P * 3);
    const rPredVel = new Float32Array(MAX_P * 3);   // 捕食者渲染速度，同样做低通
    const predCol = new Float32Array(MAX_P * 3);
    const predSiz = new Float32Array(MAX_P);
    const predFeedAt = new Float64Array(MAX_P);    // 饱腹冷却时间戳
    const predTarget = new Int16Array(MAX_P);      // 锁定的目标编号，-1 为未锁定
    predTarget.fill(-1);
    const predLockUntil = new Float64Array(MAX_P); // 锁定到期时间（ms）
    const predPulseAt = new Float64Array(MAX_P);   // 扑击瞬间，用于箭头脉冲
    predPulseAt.fill(-Infinity);

    const MAX_FORCE = 14;
    // 捕食者的碰撞体积跟随外形的等边三角形大小：接触即算捕获（仍受进食冷却限制）。
    const predBaseSize = () => Math.max(1.1, params.arrowSize * 7);
    const catchRadius = () => predBaseSize() * 0.78 + params.arrowSize * 0.6;
    const PRED_FORCE = 24;
    const PRED_SEP_RANGE2 = 6 * 6;
    const PRED_SEP_FORCE = 34;
    const COLLIDE_DIST = 0.55;
    const COLLIDE_DIST2 = COLLIDE_DIST * COLLIDE_DIST;
    const BIRTH_TOTAL_MS = 3200;                    // 新生标记总时长：前 1.8s 亮绿，后 1.4s 渐变
    const BIRTH_SOLID_MS = 1800;
    const BURST_MS = 820;                           // 捕杀动画时长，三段音效与其对齐
    const THERMAL_REF = 5.0;                        // 统计用的参考速度，与声音无关

    let density = 0, avgSpeed = 0, avgNeighbors = 0;
    let currentPace = 0;
    // 上一帧鱼群质心：用于群体级躲避，让整群像鱼群一样一起绕开捕食者。
    let groupX = 0, groupY = 0, groupZ = 0;
    // 群体惊吓波纹：捕食者进入范围时整群一起闪避一次，随后恢复群聚，不会永远逃跑。
    let groupThreatAt = -Infinity, groupWasThreat = false;
    let temperature = 0, pressure = 0, collisionImpulse = 0;
    let sprintFlash = 0, birthFlash = 0, predFlash = 0, predCatches = 0;

    function initBoids(from, to, isBirth = false) {
      const bd = bounds2D();
      for (let i = from; i < to; i++) {
        const k = i * 3;
        pos[k] = (Math.random() * 2 - 1) * bd.hx * 0.8;
        pos[k + 1] = (Math.random() * 2 - 1) * bd.hy * 0.8;
        pos[k + 2] = 0;
        const vs = 3 + Math.random() * 4;
        vel[k] = (Math.random() * 2 - 1) * vs;
        vel[k + 1] = (Math.random() * 2 - 1) * vs;
        vel[k + 2] = 0;
        rVel[k] = vel[k]; rVel[k + 1] = vel[k + 1]; rVel[k + 2] = 0;
        birthAt[i] = isBirth ? performance.now() : -Infinity;
        stamina[i] = 1; sprintUntil[i] = 0; cruiseBias[i] = 0.42;
        caught[i] = 0; respawnAt[i] = 0; fleeing[i] = 0;
      }
    }

    // 被捕食的个体在 1 秒后重新出生：在所有候选点里挑离捕食者最远、
    // 同时离边界留有余量的位置，避免「刚出生就被吃」。
    function spawnFar(i, now) {
      const k = i * 3;
      const bd = bounds2D();
      let bestX = 0, bestY = 0, bestScore = -Infinity;
      const inset = 0.18;   // 离边界至少留 18%
      for (let c = 0; c < 32; c++) {
        const x = (Math.random() * 2 - 1) * bd.hx * (1 - inset);
        const y = (Math.random() * 2 - 1) * bd.hy * (1 - inset);
        let minD2 = Infinity;
        for (let p = 0; p < activeP; p++) {
          const q = p * 3;
          const dx = x - predPos[q], dy = y - predPos[q + 1];
          const d2 = dx * dx + dy * dy;
          if (d2 < minD2) minD2 = d2;
        }
        if (minD2 === Infinity) minD2 = 0;
        const score = minD2 - Math.hypot(x, y) * 0.05;  // 轻微偏好中心
        if (score > bestScore) { bestScore = score; bestX = x; bestY = y; }
      }
      pos[k] = bestX; pos[k + 1] = bestY; pos[k + 2] = 0;
      const dir = Math.random() * Math.PI * 2;
      const vs = params.maxSpeed * (0.6 + Math.random() * 0.2);
      vel[k] = Math.cos(dir) * vs;
      vel[k + 1] = Math.sin(dir) * vs;
      vel[k + 2] = 0;
      rVel[k] = vel[k]; rVel[k + 1] = vel[k + 1]; rVel[k + 2] = 0;
      birthAt[i] = now;
      stamina[i] = 1; sprintUntil[i] = 0; fleeing[i] = 0; cruiseBias[i] = 0.42;
    }

    function initPredators(from, to) {
      const bd = bounds2D();
      for (let p = from; p < to; p++) {
        const k = p * 3;
        predPos[k] = (Math.random() * 2 - 1) * bd.hx * 0.7;
        predPos[k + 1] = (Math.random() * 2 - 1) * bd.hy * 0.7;
        predPos[k + 2] = 0;
        const vs = params.predSpeed * 0.7;
        predVel[k] = (Math.random() * 2 - 1) * vs;
        predVel[k + 1] = (Math.random() * 2 - 1) * vs;
        predVel[k + 2] = 0;
        rPredVel[k] = predVel[k]; rPredVel[k + 1] = predVel[k + 1]; rPredVel[k + 2] = 0;
        predFeedAt[p] = 0;
      }
    }
    initPredators(0, activeP);
    initBoids(0, activeCount);
    const resetBoids = () => {
      initBoids(0, activeCount);
      initPredators(0, activeP);
      predCatches = 0;
      sprintCount = 0;
      caught.fill(0); respawnAt.fill(0);
      predTarget.fill(-1); predLockUntil.fill(0); predPulseAt.fill(-Infinity);
      clearBursts();
    };
    function setPredCount(v) {
      const next = Math.max(1, Math.min(MAX_P, Math.round(v)));
      if (next > activeP) initPredators(activeP, next);
      activeP = next;
      params.predatorCount = next;
      for (let p = next; p < MAX_P; p++) predTarget[p] = -1;
      // 关键：控制绘制数量的是几何体的 instanceCount，不是 Mesh 的。
      // 之前误写 predMesh.instanceCount 导致减少数量后旧捕食者仍被绘制且不更新（定住）。
      if (predGeo) predGeo.instanceCount = next;
      for (let p = 0; p < MAX_P; p++) threatRings[p].visible = params.predatorOn && p < next;
      document.getElementById('hPred').textContent = params.predatorOn ? next : '0';
    }
    function setCount(v) {
      const next = Math.max(50, Math.min(MAX_N, Math.round(v)));
      if (next > activeCount) initBoids(activeCount, next);
      activeCount = next;
      params.count = next;
      arrowGeo.instanceCount = next;
      document.getElementById('hCount').textContent = next;
    }

    // ---------------------------------------------------------------- 场景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070f);

    const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
    const camera = orthoCam;
    // 视图：平移中心 + 缩放
    const view2D = { x: 0, y: 0, zoom: 1, tZoom: 1 };
    // 相机视野固定：只由 zoom 决定，不随「活动边界」滑块变化。
    // 否则调边界时画面会跟着缩放，看起来像动画错乱。
    const VIEW2D_HALF_H = 22.2;
    // 边界不超过默认 20 时视野固定；超过后自动拉远，保证整个边界框可见。
    function view2DFitHalfH() { return Math.max(VIEW2D_HALF_H, params.boundary + 2.2); }
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isTouch ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById('scene').appendChild(renderer.domElement);

    // 正交相机：视口按屏幕宽高比铺满，留少量安全边距；zoom 控制缩放。
    function updateOrthoFrustum() {
      const aspect = innerWidth / innerHeight;
      const halfH = view2DFitHalfH() / view2D.zoom;
      const halfW = halfH * aspect;
      orthoCam.left = -halfW; orthoCam.right = halfW;
      orthoCam.top = halfH; orthoCam.bottom = -halfH;
      orthoCam.updateProjectionMatrix();
    }
    updateOrthoFrustum();

    const cv = renderer.domElement;
    const pointers = new Map();
    let pinchDist = 0, downTime = 0, moved = 0, lastTap = 0;

    function resetView2D() {
      view2D.x = 0; view2D.y = 0; view2D.tZoom = 1; view2D.zoom = 1;
      updateOrthoFrustum();
    }

    cv.addEventListener('pointerdown', (e) => {
      try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 合成事件无真实指针 */ }
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        downTime = performance.now(); moved = 0;
      } else if (pointers.size === 2) {
        const p = [...pointers.values()];
        pinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      }
    });

    cv.addEventListener('pointermove', (e) => {
      const prev = pointers.get(e.pointerId);
      if (!prev) return;
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      prev.x = e.clientX; prev.y = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      if (pointers.size === 1) {
        // 拖拽平移视图（屏幕像素 → 世界坐标）
        const scale = (2 * view2DFitHalfH() / view2D.zoom) / innerHeight;
        view2D.x -= dx * scale;
        view2D.y += dy * scale;
      } else if (pointers.size === 2) {
        const p = [...pointers.values()];
        const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        if (pinchDist > 0 && d > 0) {
          view2D.tZoom = Math.max(0.5, Math.min(4, view2D.tZoom * d / pinchDist));
        }
        pinchDist = d;
      }
    });

    function endPointer(e) {
      if (!pointers.has(e.pointerId)) return;
      const wasSingle = pointers.size === 1;
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchDist = 0;
      if (cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId);
      // 触控双击重置视角；鼠标不参与，避免和拖拽冲突
      if (wasSingle && e.pointerType !== 'mouse' && moved < 12 && performance.now() - downTime < 260) {
        const now = performance.now();
        if (now - lastTap < 340) { resetView2D(); lastTap = 0; }
        else lastTap = now;
      }
    }
    cv.addEventListener('pointerup', endPointer);
    cv.addEventListener('pointercancel', endPointer);
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      view2D.tZoom = Math.max(0.5, Math.min(4, view2D.tZoom * Math.exp(-e.deltaY * 0.0012)));
    }, { passive: false });

    // 安全边界矩形（贴合屏幕宽高比）
    const rectFrameGeo = new THREE.BufferGeometry();
    rectFrameGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(4 * 3), 3));
    const rectFrame = new THREE.LineLoop(rectFrameGeo, new THREE.LineBasicMaterial({
      color: 0x3b7fb4, transparent: true, opacity: 0.22, depthWrite: false
    }));
    rectFrame.frustumCulled = false;
    scene.add(rectFrame);
    function bounds2D() {
      return { hx: params.boundary * (innerWidth / innerHeight), hy: params.boundary };
    }
    function updateRectFrame() {
      const { hx, hy } = bounds2D();
      const arr = rectFrameGeo.attributes.position.array;
      const pts = [[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]];
      for (let i = 0; i < 4; i++) { arr[i * 3] = pts[i][0]; arr[i * 3 + 1] = pts[i][1]; arr[i * 3 + 2] = 0; }
      rectFrameGeo.attributes.position.needsUpdate = true;
    }
    updateRectFrame();

    // ---------------------------------------------------------------- GPU 箭头
    // 一个 quad 实例一个箭头；朝向由顶点着色器在视图空间按速度方向旋转，
    // 形状用 SDF 在片元着色器里画成 ">" 形，边缘发光。
    const arrowGeo = new THREE.InstancedBufferGeometry();
    arrowGeo.setAttribute('position', new THREE.Float32BufferAttribute([
      -1, -1, 0,  1, -1, 0,  1, 1, 0,  -1, 1, 0
    ], 3));
    arrowGeo.setAttribute('aLocal', new THREE.Float32BufferAttribute([
      -1, -1,  1, -1,  1, 1,  -1, 1
    ], 2));
    arrowGeo.setIndex([0, 1, 2, 0, 2, 3]);
    const aPos = new THREE.InstancedBufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage);
    const aVel = new THREE.InstancedBufferAttribute(rVel, 3).setUsage(THREE.DynamicDrawUsage);
    const aCol = new THREE.InstancedBufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage);
    const aSiz = new THREE.InstancedBufferAttribute(siz, 1).setUsage(THREE.DynamicDrawUsage);
    arrowGeo.setAttribute('aPosition', aPos);
    arrowGeo.setAttribute('aVelocity', aVel);
    arrowGeo.setAttribute('aColor', aCol);
    arrowGeo.setAttribute('aSize', aSiz);
    arrowGeo.instanceCount = activeCount;

    const arrowMat = new THREE.ShaderMaterial({
      uniforms: { uMaxSpeed: { value: params.maxSpeed } },
      vertexShader: `
        attribute vec2 aLocal;
        attribute vec3 aPosition;
        attribute vec3 aVelocity;
        attribute vec3 aColor;
        attribute float aSize;
        uniform float uMaxSpeed;
        varying vec2 vLocal;
        varying vec3 vColor;
        varying float vSpeed;
        varying float vFade;
        void main() {
          vLocal = aLocal;
          vColor = aColor;
          vSpeed = clamp(length(aVelocity) / uMaxSpeed, 0.0, 1.0);
          vec4 mv = modelViewMatrix * vec4(aPosition, 1.0);
          vec3 vv = (modelViewMatrix * vec4(aVelocity, 0.0)).xyz;
          float ang = atan(vv.y, vv.x);
          float cs = cos(ang), sn = sin(ang);
          vec2 lp = aLocal * aSize;
          mv.xy += vec2(lp.x * cs - lp.y * sn, lp.x * sn + lp.y * cs);
          vFade = 1.0 - smoothstep(45.0, 145.0, -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec2 vLocal;
        varying vec3 vColor;
        varying float vSpeed;
        varying float vFade;
        float sdSegment(vec2 p, vec2 a, vec2 b) {
          vec2 pa = p - a, ba = b - a;
          float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
          return length(pa - ba * h);
        }
        void main() {
          vec2 p = vLocal;
          float d = min(
            sdSegment(p, vec2(0.90, 0.0), vec2(-0.42, 0.86)),
            sdSegment(p, vec2(0.90, 0.0), vec2(-0.42, -0.86))
          );
          float core = 1.0 - smoothstep(0.10, 0.17, d);
          float halo = exp(-d * 3.6) * 0.34;
          float a = clamp(core + halo, 0.0, 1.0) * vFade;
          if (a < 0.004) discard;
          vec3 c = vColor * (0.85 + 0.70 * vSpeed) * (core + halo * 0.55);
          gl_FragColor = vec4(c, a);
          #include <colorspace_fragment>
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const arrows = new THREE.Mesh(arrowGeo, arrowMat);
    arrows.frustumCulled = false;
    scene.add(arrows);

    // ---------------------------------------------------------------- 捕食者渲染
    // 同样是箭头，但用「实心宽箭头」+ 暖橙红色 + 亮边，和猎物的细线「>」一眼分开；
    // 尺寸只比猎物大几倍，不再使用夸张的大剪影。
    const predGeo = new THREE.InstancedBufferGeometry();
    predGeo.setAttribute('position', arrowGeo.getAttribute('position'));
    predGeo.setAttribute('aLocal', arrowGeo.getAttribute('aLocal'));
    predGeo.setIndex([0, 1, 2, 0, 2, 3]);
    const pPos = new THREE.InstancedBufferAttribute(predPos, 3).setUsage(THREE.DynamicDrawUsage);
    const pVel = new THREE.InstancedBufferAttribute(rPredVel, 3).setUsage(THREE.DynamicDrawUsage);
    const pCol = new THREE.InstancedBufferAttribute(predCol, 3).setUsage(THREE.DynamicDrawUsage);
    const pSiz = new THREE.InstancedBufferAttribute(predSiz, 1).setUsage(THREE.DynamicDrawUsage);
    predGeo.setAttribute('aPosition', pPos);
    predGeo.setAttribute('aVelocity', pVel);
    predGeo.setAttribute('aColor', pCol);
    predGeo.setAttribute('aSize', pSiz);
    predGeo.instanceCount = activeP;
    const predMat = arrowMat.clone();
    predMat.uniforms.uMaxSpeed.value = params.predSpeed;
    // 等边锐角三角形：三边等长、方向即运动方向，和猎物细线「>」完全不同。
    predMat.fragmentShader = `
      varying vec2 vLocal;
      varying vec3 vColor;
      varying float vSpeed;
      varying float vFade;
      float sdTri(vec2 p, vec2 a, vec2 b, vec2 c) {
        vec2 e0 = b - a, e1 = c - b, e2 = a - c;
        vec2 v0 = p - a, v1 = p - b, v2 = p - c;
        vec2 q0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
        vec2 q1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
        vec2 q2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
        float s = sign(e0.x * e2.y - e0.y * e2.x);
        vec2 d = min(min(vec2(dot(q0, q0), s * (v0.x * e0.y - v0.y * e0.x)),
                         vec2(dot(q1, q1), s * (v1.x * e1.y - v1.y * e1.x))),
                     vec2(dot(q2, q2), s * (v2.x * e2.y - v2.y * e2.x)));
        return -sqrt(d.x) * sign(d.y);
      }
      void main() {
        vec2 p = vLocal;
        // 顶点 (1,0)、(-0.5,±√3/2)：中心在原点的等边三角形
        float d = sdTri(p, vec2(1.0, 0.0), vec2(-0.5, 0.8660254), vec2(-0.5, -0.8660254));
        float fill = 1.0 - smoothstep(0.0, 0.035, d);
        float rim = exp(-abs(d) * 20.0) * 0.32;
        float glow = exp(-max(d, 0.0) * 7.0) * 0.28;
        float a = clamp(fill + glow, 0.0, 1.0) * vFade;
        if (a < 0.004) discard;
        vec3 c = vColor * (0.92 + 0.32 * vSpeed) * (fill * 0.88 + rim + glow * 0.5);
        float tip = 1.0 - smoothstep(0.05, 0.34, length(p - vec2(0.72, 0.0)));
        c = mix(c, vec3(1.0, 0.95, 0.82), tip * 0.45 * fill);
        gl_FragColor = vec4(c, a);
        #include <colorspace_fragment>
      }
    `;
    predMat.needsUpdate = true;
    let predMesh = new THREE.Mesh(predGeo, predMat);
    predMesh.frustumCulled = false;
    predMesh.visible = params.predatorOn;
    scene.add(predMesh);

    // 威胁圈：标示该捕食者的逃逸半径 R，始终朝向相机（billboard）
    const ringGeo = new THREE.RingGeometry(0.972, 1.0, 72);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xff6b3d, transparent: true, opacity: 0.20,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
    });
    const threatRings = [];
    for (let p = 0; p < MAX_P; p++) {
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.visible = false;
      ring.frustumCulled = false;
      threatRings.push(ring);
      scene.add(ring);
      predCol[p * 3] = 1.0; predCol[p * 3 + 1] = 0.34; predCol[p * 3 + 2] = 0.12;
      predSiz[p] = predBaseSize();
    }

    // 捕杀特效三段式：0ms 亮核爆闪 → 90ms 内环扩张 + 火花 → 240ms 外环余波。
    // 三段分别对应 predate() 的三段音。
    const SPARKS = 10;
    const burstInnerGeo = new THREE.RingGeometry(0.88, 1.0, 40);
    const burstOuterGeo = new THREE.RingGeometry(0.72, 1.0, 48);
    const burstCoreGeo = new THREE.CircleGeometry(1, 32);
    const killBursts = [];
    for (let b = 0; b < 14; b++) {
      const common = {
        transparent: true, side: THREE.DoubleSide, depthWrite: false,
        blending: THREE.AdditiveBlending, fog: false
      };
      const core = new THREE.Mesh(burstCoreGeo, new THREE.MeshBasicMaterial({ ...common, color: 0xffffff, opacity: 0 }));
      const inner = new THREE.Mesh(burstInnerGeo, new THREE.MeshBasicMaterial({ ...common, color: 0xffd6a0, opacity: 0 }));
      const outer = new THREE.Mesh(burstOuterGeo, new THREE.MeshBasicMaterial({ ...common, color: 0xff7a3d, opacity: 0 }));
      const sparkGeo = new THREE.BufferGeometry();
      sparkGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(SPARKS * 3), 3));
      const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
        color: 0xffdcae, size: 3.6, sizeAttenuation: false,
        transparent: true, opacity: 0, depthWrite: false,
        blending: THREE.AdditiveBlending, fog: false
      }));
      for (const o of [core, inner, outer, sparks]) {
        o.visible = false; o.frustumCulled = false; scene.add(o);
      }
      killBursts.push({
        core, inner, outer, sparks,
        dirs: new Float32Array(SPARKS * 2),
        active: false, born: 0, x: 0, y: 0
      });
    }
    function spawnBurst(x, y, z, now) {
      let slot = killBursts.find((b) => !b.active);
      if (!slot) slot = killBursts.reduce((a, b) => (a.born < b.born ? a : b)); // 池满则复用最老
      slot.active = true; slot.born = now; slot.x = x; slot.y = y;
      for (let s = 0; s < SPARKS; s++) {
        const a = Math.random() * Math.PI * 2;
        slot.dirs[s * 2] = Math.cos(a); slot.dirs[s * 2 + 1] = Math.sin(a);
      }
      for (const o of [slot.core, slot.inner, slot.outer, slot.sparks]) o.visible = true;
    }
    function clearBursts() {
      for (const b of killBursts) {
        b.active = false;
        for (const o of [b.core, b.inner, b.outer, b.sparks]) o.visible = false;
      }
    }

    const tmpColor = new THREE.Color();
    const tmpBirth = new THREE.Color(0x7dff9a);
    const tmpSprint = new THREE.Color(0xffd36e);   // 爆发逃逸：暖金色高亮

    // ---------------------------------------------------------------- 声音
    // 只保留三种事件音：加速逃逸 / 被吃掉 / 新生。
    // 没有持续背景音，也没有碰撞与琶音；静音时断开输出并挂起 AudioContext。
    class FlockAudio {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.muted = false;
        this.outputConnected = false;
        this.lastSprint = 0; this.sprintWindow = 0; this.sprintCount = 0;
        this.lastPred = 0;   this.predWindow = 0;   this.predCount = 0;
        this.lastBirth = 0;  this.birthWindow = 0;  this.birthCount = 0;
        this.lastSprintDur = 0;
        this.total = { sprint: 0, predate: 0, birth: 0 };
      }

      async enable() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) throw new Error('当前浏览器不支持 Web Audio API');
          const ctx = this.ctx = new AC();

          this.master = ctx.createGain();
          this.master.gain.value = params.master;
          this.master.connect(ctx.destination);
          this.outputConnected = true;

          // 短噪声缓冲：逃逸气流声与被吃掉的咬合声共用
          const len = Math.floor(ctx.sampleRate * 0.25);
          this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
          const data = this.noise.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }
        await this.ctx.resume();
        this.enabled = true;
        this.muted = false;
        params.enabled = true;
        this.refreshButton();
      }

      refreshButton() {
        const btn = document.getElementById('audioBtn');
        const live = this.enabled && !this.muted;
        btn.classList.toggle('live', live);
        const label = !this.enabled ? '开启声音' : (this.muted ? '声音已关闭，点击开启' : '声音已开启，点击静音');
        btn.title = label;
        btn.setAttribute('aria-label', label);
      }

      // 彻底静音：增益归零 + 断开主输出 + 暂停整个 AudioContext。
      // 只把增益降到 0 仍可能让已排队的碰撞/琶音节点漏出残响，所以必须同时断开到 destination 的连接。
      setMuted(m) {
        this.muted = m;
        if (this.master) {
          const t = this.ctx.currentTime;
          this.master.gain.cancelScheduledValues(t);
          this.master.gain.value = m ? 0 : params.master;
          if (m) {
            this.master.disconnect();
            this.outputConnected = false;
          } else {
            this.master.disconnect();
            this.master.connect(this.ctx.destination);
            this.outputConnected = true;
          }
        }
        if (this.ctx) {
          if (m) this.ctx.suspend().catch(() => {});
          else this.ctx.resume().catch(() => {});
        }
        this.refreshButton();
      }

      toggle() {
        if (!this.enabled) return this.enable();
        this.setMuted(!this.muted);
        return Promise.resolve();
      }

      // 1) 加速逃逸：轻柔、短促的一次向上滑音，像「提速」而不是爆响。
      //    多只同时爆发时限流并压低音量；时长随爆发持续时间变化。
      sprint(intensity = 0) {
        if (!this.enabled || this.muted || !params.predatorOn) return;
        const now = performance.now();
        if (now - this.lastSprint < 120) return;
        if (now > this.sprintWindow) { this.sprintWindow = now + 1000; this.sprintCount = 0; }
        if (this.sprintCount >= 6) return;
        this.lastSprint = now; this.sprintCount++; this.total.sprint++;
        sprintFlash = 1;

        const ctx = this.ctx, t = ctx.currentTime;
        const amp = 0.4 + 0.6 * Math.max(0, Math.min(1, intensity));
        const dur = Math.max(0.14, Math.min(0.55, params.sprintDuration * 0.30));
        this.lastSprintDur = +dur.toFixed(3);
        const fade = Math.max(0.012, dur - 0.012);

        // 低通后的极轻气流层：只有一点点「呼」的加速感
        const src = ctx.createBufferSource();
        src.buffer = this.noise;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.Q.value = 0.6;
        lp.frequency.setValueAtTime(280, t);
        lp.frequency.exponentialRampToValueAtTime(1100, t + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.010 + 0.010 * amp, t + Math.min(0.03, dur * 0.2));
        g.gain.exponentialRampToValueAtTime(0.0001, t + fade);
        src.connect(lp); lp.connect(g); g.connect(this.master);
        src.start(t); src.stop(t + dur + 0.02);

        // 柔和正弦上滑，和气流层叠在一起只占很低音量
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(210, t);
        o.frequency.exponentialRampToValueAtTime(580, t + dur * 0.85);
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.0001, t);
        g2.gain.exponentialRampToValueAtTime(0.007 + 0.008 * amp, t + Math.min(0.025, dur * 0.18));
        g2.gain.exponentialRampToValueAtTime(0.0001, t + fade);
        o.connect(g2); g2.connect(this.master);
        o.start(t); o.stop(t + dur + 0.02);
      }

      // 2) 被吃掉：三段音与捕杀动画同步——
      //    0ms 亮核闪光=低频撞击；90ms 内环扩张=撕裂噪声；240ms 外环与火花=低沉余波。
      predate(J) {
        if (!this.enabled || this.muted || !params.predatorOn) return;
        const now = performance.now();
        if (now - this.lastPred < 120) return;
        if (now > this.predWindow) { this.predWindow = now + 1000; this.predCount = 0; }
        if (this.predCount >= 5) return;
        this.lastPred = now; this.predCount++; this.total.predate++;
        predFlash = 1;

        const ctx = this.ctx, t = ctx.currentTime;
        const amp = Math.max(0, Math.min(1, J));
        const f = 95 + 150 * Math.sqrt(amp);

        // 第一段：撞击（对应亮核爆闪）
        const o1 = ctx.createOscillator();
        o1.type = 'triangle';
        o1.frequency.setValueAtTime(f, t);
        o1.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.10);
        const g1 = ctx.createGain();
        g1.gain.setValueAtTime(0.0001, t);
        g1.gain.exponentialRampToValueAtTime(0.065 + 0.055 * amp, t + 0.006);
        g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        o1.connect(g1); g1.connect(this.master);
        o1.start(t); o1.stop(t + 0.13);

        // 第二段：撕裂（对应内环扩张与火花飞散）
        const t2 = t + 0.09;
        const src = ctx.createBufferSource();
        src.buffer = this.noise;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.Q.value = 1.0;
        bp.frequency.setValueAtTime(1500, t2);
        bp.frequency.exponentialRampToValueAtTime(520, t2 + 0.17);
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.0001, t2);
        g2.gain.exponentialRampToValueAtTime(0.055 + 0.045 * amp, t2 + 0.02);
        g2.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.19);
        src.connect(bp); bp.connect(g2); g2.connect(this.master);
        src.start(t2); src.stop(t2 + 0.2);

        // 第三段：余波（对应外环扩散到最大）
        const t3 = t + 0.24;
        const o3 = ctx.createOscillator();
        o3.type = 'sine';
        o3.frequency.setValueAtTime(f * 0.85, t3);
        o3.frequency.exponentialRampToValueAtTime(f * 0.42, t3 + 0.34);
        const g3 = ctx.createGain();
        g3.gain.setValueAtTime(0.0001, t3);
        g3.gain.exponentialRampToValueAtTime(0.04 + 0.035 * amp, t3 + 0.03);
        g3.gain.exponentialRampToValueAtTime(0.0001, t3 + 0.38);
        o3.connect(g3); g3.connect(this.master);
        o3.start(t3); o3.stop(t3 + 0.4);
      }

      // 3) 新生：两声短促上行的清亮提示音，捕获后被吃的声音之后响起。
      birth() {
        if (!this.enabled || this.muted) return;
        const now = performance.now();
        if (now - this.lastBirth < 90) return;
        if (now > this.birthWindow) { this.birthWindow = now + 1000; this.birthCount = 0; }
        if (this.birthCount >= 5) return;
        this.lastBirth = now; this.birthCount++; this.total.birth++;
        birthFlash = 1;

        const ctx = this.ctx, t = ctx.currentTime;
        for (const [delay, f1, f2] of [[0, 740, 1100], [0.085, 990, 1480]]) {
          const o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.setValueAtTime(f1, t + delay);
          o.frequency.exponentialRampToValueAtTime(f2, t + delay + 0.07);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t + delay);
          g.gain.exponentialRampToValueAtTime(0.075, t + delay + 0.008);
          g.gain.exponentialRampToValueAtTime(0.0001, t + delay + 0.09);
          o.connect(g); g.connect(this.master);
          o.start(t + delay); o.stop(t + delay + 0.1);
        }
      }
    }

    // ---------------------------------------------------------------- 空间哈希
    const grid = new Map();
    function keyOf(ix, iy, iz) {
      return ((ix + 512) * 1024 + (iy + 512)) * 1024 + (iz + 512);
    }

    // ---------------------------------------------------------------- 模拟
    function step(dt, time) {
      const n = activeCount;
      const cell = params.perception;
      const per2 = cell * cell;
      const sep2 = params.separationRange * params.separationRange;
      const maxSpeed = params.maxSpeed;
      const maxForce = MAX_FORCE;
      const B = params.boundary;
      const bd = bounds2D();                        // 矩形半宽/半高
      const hx = bd.hx, hy = bd.hy;
      const flowT = time * 0.00022;
      const P = params.predatorOn ? activeP : 0;
      const fleeR = params.fleeRange;
      const fleeR2 = fleeR * fleeR;
      const predSpeed = params.predSpeed;
      const predNorm = Math.pow(predSpeed, 1.2);
      const sprintSpeed = maxSpeed * params.sprintFactor;
      const catchR2 = Math.pow(catchRadius(), 2);
      // 群体巡航节奏：无威胁时逐只向这个速度靠拢，避免全员一直顶着上限飞。
      const paceSpeed = Math.max(maxSpeed * 0.62, Math.min(maxSpeed * 0.88, avgSpeed || maxSpeed * 0.78));
      currentPace = paceSpeed;
      sprintingCount = 0;

      // 群体惊吓检测：捕食者接近鱼群质心时触发一次波纹，离开后再进入才重新触发。
      if (P > 0) {
        let near = false;
        for (let p = 0; p < P; p++) {
          const q = p * 3;
          if (Math.hypot(groupX - predPos[q], groupY - predPos[q + 1]) < fleeR * 2.5) {
            near = true; break;
          }
        }
        if (near && !groupWasThreat) groupThreatAt = time;
        groupWasThreat = near;
      } else groupWasThreat = false;

      grid.clear();
      for (let i = 0; i < n; i++) {
        if (caught[i]) continue;   // 等待重生的个体不参与邻域
        const k = i * 3;
        const key = keyOf(Math.floor(pos[k] / cell), Math.floor(pos[k + 1] / cell), 0);
        let bucket = grid.get(key);
        if (!bucket) { bucket = []; grid.set(key, bucket); }
        bucket.push(i);
      }

      // ---- 捕食者：Reynolds 预测拦截 + 相互分离 + 边界约束 ----
      if (P > 0) {
        for (let p = 0; p < P; p++) {
          const q = p * 3;
          const ppx = predPos[q], ppy = predPos[q + 1], ppz = predPos[q + 2];
          const pvx = predVel[q], pvy = predVel[q + 1], pvz = predVel[q + 2];
          // 进食冷却期减速巡游，节省体力；追击转向也随之变缓。
          const cooling = time - predFeedAt[p] < params.feedCooldown * 1000;
          const curSpeed = cooling ? predSpeed * 0.55 : predSpeed;
          const chase = params.chaseWeight * (cooling ? 0.55 : 1);

          // 目标锁定：先沿用旧目标，超出视野或锁定过期才重选最近个体。
          // 每帧改追最近者会让鱼群的「迷惑效应」把捕食者拖死，短期记忆可形成稳定直线追击。
          const vision2 = Math.pow(Math.max(fleeR * 3, B * 1.3), 2);
          let best = predTarget[p], bestD2 = Infinity;
          if (best >= 0 && best < n && !caught[best]) {
            const m = best * 3;
            const dx = pos[m] - ppx, dy = pos[m + 1] - ppy, dz = pos[m + 2] - ppz;
            bestD2 = dx * dx + dy * dy + dz * dz;
          }
          if (best < 0 || best >= n || caught[best] || bestD2 > vision2 || time > predLockUntil[p]) {
            best = -1; bestD2 = Infinity;
            for (let j = 0; j < n; j++) {
              if (caught[j]) continue;
              const m = j * 3;
              const dx = pos[m] - ppx, dy = pos[m + 1] - ppy, dz = pos[m + 2] - ppz;
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 < bestD2) { bestD2 = d2; best = j; }
            }
          }
          if (best >= 0) {
            predTarget[p] = best;
            predLockUntil[p] = time + params.lockTime * 1000;   // 有效期间持续续期
          } else {
            predTarget[p] = -1;
          }

          let ax = 0, ay = 0, az = 0;
          if (best >= 0) {
            const m = best * 3;
            const d = Math.sqrt(bestD2);
            const ux = vel[m], uy = vel[m + 1], uz = vel[m + 2];
            const u2 = ux * ux + uy * uy + uz * uz;
            const ru = (pos[m] - ppx) * ux + (pos[m + 1] - ppy) * uy + (pos[m + 2] - ppz) * uz;
            // 解 |r + u·t| = v·t：比 τ=d/v 更准确地预判侧向移动目标。
            const a = curSpeed * curSpeed - u2;
            let tau;
            if (a > 1e-6) {
              tau = (ru + Math.sqrt(Math.max(0, ru * ru + a * bestD2))) / a;
            } else {
              tau = d / Math.max(curSpeed, 1e-6);   // 捕食者不够快时退化为直追
            }
            if (!isFinite(tau) || tau < 0) tau = d / Math.max(curSpeed, 1e-6);
            tau = Math.min(1.2, tau);                 // 限制远距离过度预判
            const aimx = pos[m] + ux * tau;
            const aimy = pos[m + 1] + uy * tau;
            const aimz = pos[m + 2] + uz * tau;
            let tx = aimx - ppx, ty = aimy - ppy, tz = aimz - ppz;
            const tl = Math.hypot(tx, ty, tz);
            if (tl > 1e-6) {
              tx = tx / tl * curSpeed - pvx;
              ty = ty / tl * curSpeed - pvy;
              tz = tz / tl * curSpeed - pvz;
              const sl = Math.hypot(tx, ty, tz);
              if (sl > PRED_FORCE) { const k = PRED_FORCE / sl; tx *= k; ty *= k; tz *= k; }
              ax += tx * chase; ay += ty * chase; az += tz * chase;
            }
          }

          // 捕食者之间反平方分离，避免叠在一起
          for (let r = 0; r < P; r++) {
            if (r === p) continue;
            const s = r * 3;
            const dx = ppx - predPos[s], dy = ppy - predPos[s + 1], dz = ppz - predPos[s + 2];
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 > 1e-6 && d2 < PRED_SEP_RANGE2) {
              const inv = PRED_SEP_FORCE / Math.max(d2, 0.5);
              ax += dx * inv; ay += dy * inv; az += dz * inv;
            }
          }

          // 软边界：靠近边缘时往回推
          const m = 2;
          if (ppx > hx - m) ax -= (ppx - (hx - m)) * 3;
          if (ppx < -hx + m) ax += (-hx + m - ppx) * 3;
          if (ppy > hy - m) ay -= (ppy - (hy - m)) * 3;
          if (ppy < -hy + m) ay += (-hy + m - ppy) * 3;
          az = 0;

          let nvx = pvx + ax * dt, nvy = pvy + ay * dt;
          let sp = Math.hypot(nvx, nvy);
          if (sp > curSpeed) { const k = curSpeed / sp; nvx *= k; nvy *= k; }
          else if (sp < curSpeed * 0.35 && sp > 1e-6) { const k = curSpeed * 0.35 / sp; nvx *= k; nvy *= k; }
          predVel[q] = nvx; predVel[q + 1] = nvy; predVel[q + 2] = 0;
          predPos[q] = ppx + nvx * dt;
          predPos[q + 1] = ppy + nvy * dt;
          predPos[q + 2] = 0;
          // 矩形硬边界：逐轴夹紧并弹性反射
          if (predPos[q] > hx) { predPos[q] = hx; predVel[q] = -Math.abs(nvx) * 0.9; }
          else if (predPos[q] < -hx) { predPos[q] = -hx; predVel[q] = Math.abs(nvx) * 0.9; }
          if (predPos[q + 1] > hy) { predPos[q + 1] = hy; predVel[q + 1] = -Math.abs(nvy) * 0.9; }
          else if (predPos[q + 1] < -hy) { predPos[q + 1] = -hy; predVel[q + 1] = Math.abs(nvy) * 0.9; }
        }
      }

      let sumNeighbors = 0;
      let deadCount = 0;
      for (let i = 0; i < n; i++) if (caught[i]) deadCount++;
      const aliveN = Math.max(1, n - deadCount);
      let cx = 0, cy = 0, cz = 0;
      let impact = 0;
      let boundaryImpact = 0;

      for (let i = 0; i < n; i++) {
        if (caught[i]) continue;   // 死亡等待期不参与运动与统计
        const k = i * 3;
        const px = pos[k], py = pos[k + 1], pz = pos[k + 2];
        let vx = vel[k], vy = vel[k + 1], vz = vel[k + 2];
        // 安全时按群体节奏控速；受惊或爆发时恢复满速规则。
        const calm = !fleeing[i] && time >= sprintUntil[i];
        const desiredSpeed = calm ? paceSpeed : maxSpeed;
        let count = 0;
        let sx = 0, sy = 0, sz = 0;
        let ax = 0, ay = 0, az = 0;
        let dxs = 0, dys = 0, dzs = 0;
        let cfx = 0, cfy = 0, cfz = 0, cascadeCount = 0;   // 信息级联：邻居上一帧的逃逸方向

        const ix = Math.floor(px / cell), iy = Math.floor(py / cell), iz = Math.floor(pz / cell);
        for (let ox = -1; ox <= 1; ox++) {
          for (let oy = -1; oy <= 1; oy++) {
            for (let oz = -1; oz <= 1; oz++) {
              const bucket = grid.get(keyOf(ix + ox, iy + oy, iz + oz));
              if (!bucket) continue;
              for (let b = 0; b < bucket.length; b++) {
                const j = bucket[b];
                if (j === i || caught[j]) continue;
                const m = j * 3;
                const dx = px - pos[m], dy = py - pos[m + 1], dz = pz - pos[m + 2];
                const d2 = dx * dx + dy * dy + dz * dz;
                if (d2 > per2 || d2 < 1e-8) continue;

                count++;
                sx += pos[m]; sy += pos[m + 1]; sz += pos[m + 2];
                ax += vel[m]; ay += vel[m + 1]; az += vel[m + 2];
                if (P > 0 && params.infoCascade && fleeing[j]) {
                  cfx += prevFlee[m]; cfy += prevFlee[m + 1]; cfz += prevFlee[m + 2];
                  cascadeCount++;
                }
                if (d2 < sep2) {
                  const inv = 1 / d2;
                  dxs += dx * inv; dys += dy * inv; dzs += dz * inv;
                }
                if (d2 < COLLIDE_DIST2) {
                  const dist = Math.sqrt(d2);
                  const nx = dx / dist, ny = dy / dist, nz = dz / dist;
                  const rvx = vx - vel[m], rvy = vy - vel[m + 1], rvz = vz - vel[m + 2];
                  const closing = -(rvx * nx + rvy * ny + rvz * nz); // 相向接近才计冲量
                  if (closing > 0) impact = Math.max(impact, Math.pow(closing, 1.2));
                }
              }
            }
          }
        }
        neighbors[i] = count;
        sumNeighbors += count;
        cx += px; cy += py; cz += pz;

        let fx = 0, fy = 0, fz = 0;
        if (count > 0) {
          let len = Math.hypot(ax, ay, az);
          if (len > 1e-6) {
            const s = desiredSpeed / len;
            let tx = ax * s - vx, ty = ay * s - vy, tz = az * s - vz;
            const tl = Math.hypot(tx, ty, tz);
            if (tl > maxForce) { const q = maxForce / tl; tx *= q; ty *= q; tz *= q; }
            fx += tx * params.alignment; fy += ty * params.alignment; fz += tz * params.alignment;
          }
          let tx = sx / count - px, ty = sy / count - py, tz = sz / count - pz;
          len = Math.hypot(tx, ty, tz);
          if (len > 1e-6) {
            const s = desiredSpeed / len;
            tx = tx * s - vx; ty = ty * s - vy; tz = tz * s - vz;
            const tl = Math.hypot(tx, ty, tz);
            if (tl > maxForce) { const q = maxForce / tl; tx *= q; ty *= q; tz *= q; }
            fx += tx * params.cohesion; fy += ty * params.cohesion; fz += tz * params.cohesion;
          }
        }
        const sl = Math.hypot(dxs, dys, dzs);
        if (sl > 1e-6) {
          const s = desiredSpeed / sl;
          let tx = dxs * s - vx, ty = dys * s - vy, tz = dzs * s - vz;
          const tl = Math.hypot(tx, ty, tz);
          if (tl > maxForce) { const q = maxForce / tl; tx *= q; ty *= q; tz *= q; }
          fx += tx * params.separation; fy += ty * params.separation; fz += tz * params.separation;
        }

        // ---- 猎物逃逸：预测威胁点 + 距离平方衰减 + 信息级联 ----
        // 白肌式短时爆发：体力满 + 进入危险范围才触发，持续固定时长后体力清零；
        // 必须等 sprintRecovery 秒完全恢复才能再次爆发，所以不能连续冲刺。
        let sprinting = time < sprintUntil[i];
        if (P > 0) {
          let nearest2 = Infinity, nearestP = -1;
          for (let p = 0; p < P; p++) {
            const q = p * 3;
            const dx = px - predPos[q], dy = py - predPos[q + 1], dz = pz - predPos[q + 2];
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 < nearest2) { nearest2 = d2; nearestP = p; }
          }
          if (nearest2 < fleeR2 && stamina[i] >= 1 && time >= sprintUntil[i]) {
            sprintUntil[i] = time + params.sprintDuration * 1000;
            stamina[i] = 0;
            sprintCount++;
            audio.sprint(Math.min(1, Math.sqrt(nearest2) / fleeR));
            // 瞬间启动冲量（类似鱼类 fast-start）：立刻拉开距离，而不是只提高速度上限。
            const q = nearestP * 3;
            let bx = px - predPos[q], by = py - predPos[q + 1];
            let bl = Math.hypot(bx, by);
            if (bl < 1e-6) { bx = vx; by = vy; bl = Math.hypot(bx, by); }
            if (bl > 1e-6) {
              const dash = Math.max(maxSpeed * 1.25, Math.hypot(vx, vy) * 1.35);
              vx = bx / bl * dash; vy = by / bl * dash; vz = 0;
              vel[k] = vx; vel[k + 1] = vy; vel[k + 2] = 0;
            }
          }
          sprinting = time < sprintUntil[i];

          let efx = 0, efy = 0, efz = 0;
          for (let p = 0; p < P; p++) {
            const q = p * 3;
            const dx = px - predPos[q], dy = py - predPos[q + 1], dz = pz - predPos[q + 2];
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 >= fleeR2 || d2 < 1e-8) continue;
            const d = Math.sqrt(d2);
            const tau = (d / maxSpeed) * params.predict;
            // 威胁点取捕食者未来位置；方向为从威胁点指向自己
            let ex = px - (predPos[q] + predVel[q] * tau);
            let ey = py - (predPos[q + 1] + predVel[q + 1] * tau);
            let ez = pz - (predPos[q + 2] + predVel[q + 2] * tau);
            const el = Math.hypot(ex, ey, ez);
            if (el < 1e-6) continue;
            const escapeSpeed = sprinting ? sprintSpeed : maxSpeed;
            let tx = ex / el * escapeSpeed - vx;
            let ty = ey / el * escapeSpeed - vy;
            let tz = ez / el * escapeSpeed - vz;
            const tl = Math.hypot(tx, ty, tz);
            const fCap = sprinting ? maxForce * 2 : maxForce;
            if (tl > fCap) { const s = fCap / tl; tx *= s; ty *= s; tz *= s; }
            const w = 1 - d / fleeR;                 // 到半径边缘恰好为 0，避免力突变
            const mag = params.fleeWeight * w * w * (sprinting ? 1.25 : 1);
            efx += tx * mag; efy += ty * mag; efz += tz * mag;
          }
          // 群体级躲避：捕食者进入范围时整群沿远离它的方向一起偏航一次（约 1.2 秒波纹），
          // 随后停止群体推力，让鱼群重新聚合——像真实鱼群遇鲨后散开再合拢，而不是永远四散。
          const ripple = Math.max(0, 1 - (time - groupThreatAt) / 1200);
          if (ripple > 0) {
            for (let p = 0; p < P; p++) {
              const q = p * 3;
              const gdx = groupX - predPos[q], gdy = groupY - predPos[q + 1];
              const gl = Math.hypot(gdx, gdy);
              if (gl < 1e-6) continue;
              const dx = px - predPos[q], dy = py - predPos[q + 1];
              const d = Math.hypot(dx, dy);
              if (d > fleeR * 2.5) continue;
              const w = Math.max(0, 1 - d / (fleeR * 2.5));
              const strength = params.fleeWeight * w * ripple * 1.6;
              efx += gdx / gl * strength;
              efy += gdy / gl * strength;
              efz = 0;
            }
          }
          // 信息级联：邻居上一帧的逃逸方向传播过来，形成波状逃逸
          if (params.infoCascade && cascadeCount > 0) {
            const s = 0.80 / cascadeCount;
            efx += cfx * s; efy += cfy * s; efz += cfz * s;
          }
          const mag = Math.hypot(efx, efy, efz);
          if (mag > 1e-6) {
            fleeDir[k] = efx / mag; fleeDir[k + 1] = efy / mag; fleeDir[k + 2] = efz / mag;
            fleeing[i] = 1;
            fx += efx; fy += efy; fz += efz;
          } else {
            fleeDir[k] = 0; fleeDir[k + 1] = 0; fleeDir[k + 2] = 0;
            fleeing[i] = 0;
          }
        } else {
          fleeDir[k] = 0; fleeDir[k + 1] = 0; fleeDir[k + 2] = 0;
          fleeing[i] = 0;
        }
        if (sprinting) sprintingCount++;
        else if (stamina[i] < 1) stamina[i] = Math.min(1, stamina[i] + dt / params.sprintRecovery);

        // 矩形边界力
        const m = 3;
        if (px > hx - m) fx -= (px - (hx - m)) * 2.2;
        if (px < -hx + m) fx += (-hx + m - px) * 2.2;
        if (py > hy - m) fy -= (py - (hy - m)) * 2.2;
        if (py < -hy + m) fy += (-hy + m - py) * 2.2;
        fx += Math.sin(py * 0.11 + flowT) * params.flow;
        fy += Math.cos(px * 0.09 - flowT * 0.8) * params.flow * 0.7;
        acc[k] = fx; acc[k + 1] = fy; acc[k + 2] = 0;
      }
      if (aliveN > 0) { groupX = cx / aliveN; groupY = cy / aliveN; groupZ = 0; }

      let speedSum = 0, keSum = 0;
      for (let i = 0; i < n; i++) {
        if (caught[i]) continue;
        const k = i * 3;
        let vx = vel[k] + acc[k] * dt;
        let vy = vel[k + 1] + acc[k + 1] * dt;
        let sp = Math.hypot(vx, vy);
        const sprinting = time < sprintUntil[i];
        const cap = sprinting ? sprintSpeed : maxSpeed;
        if (sp > cap) { const q = cap / sp; vx *= q; vy *= q; sp = cap; }
        else if (sp < params.minSpeed && sp > 1e-6) { const q = params.minSpeed / sp; vx *= q; vy *= q; sp = params.minSpeed; }
        // 无威胁且不在爆发期：个体巡航比例缓慢向群体节奏靠拢（约 2.5 秒时间常数）。
        if (!sprinting && !fleeing[i]) {
          cruiseBias[i] += (paceSpeed / maxSpeed - cruiseBias[i]) * Math.min(1, dt / 2.5);
          const target = Math.max(params.minSpeed, maxSpeed * cruiseBias[i]);
          // 比例本身用 2.5s 慢慢贴近群体节奏；实际速度紧跟这个比例（只控速、不改方向）。
          const ns = Math.max(params.minSpeed,
            sp + (target - sp) * Math.min(1, dt / 0.08));
          const q = ns / sp; vx *= q; vy *= q; sp = ns;
        }
        vel[k] = vx; vel[k + 1] = vy; vel[k + 2] = 0;
        speedSum += sp;
        keSum += 0.5 * sp * sp;

        pos[k] += vx * dt; pos[k + 1] += vy * dt;
        // 矩形硬边界：逐轴夹紧并弹性反射
        if (pos[k] > hx) { pos[k] = hx; vel[k] = -Math.abs(vx) * 0.92; boundaryImpact = Math.max(boundaryImpact, Math.pow(2 * Math.abs(vx), 1.2)); }
        else if (pos[k] < -hx) { pos[k] = -hx; vel[k] = Math.abs(vx) * 0.92; boundaryImpact = Math.max(boundaryImpact, Math.pow(2 * Math.abs(vx), 1.2)); }
        if (pos[k + 1] > hy) { pos[k + 1] = hy; vel[k + 1] = -Math.abs(vy) * 0.92; boundaryImpact = Math.max(boundaryImpact, Math.pow(2 * Math.abs(vy), 1.2)); }
        else if (pos[k + 1] < -hy) { pos[k + 1] = -hy; vel[k + 1] = Math.abs(vy) * 0.92; boundaryImpact = Math.max(boundaryImpact, Math.pow(2 * Math.abs(vy), 1.2)); }
        pos[k + 2] = 0; vel[k + 2] = 0;

        // 捕获：捕食者三角形有碰撞体积，接触即算捕食成功（仍受进食冷却限制）
        if (P > 0 && !caught[i]) {
          for (let p = 0; p < P; p++) {
            if (time - predFeedAt[p] < params.feedCooldown * 1000) continue;
            const q = p * 3;
            const dx = pos[k] - predPos[q], dy = pos[k + 1] - predPos[q + 1];
            if (dx * dx + dy * dy >= catchR2) continue;
            const rvx = vx - predVel[q], rvy = vy - predVel[q + 1];
            const vrel = Math.max(0.5, Math.hypot(rvx, rvy));
            const J = Math.pow(vrel, 1.2) / predNorm;
            audio.predate(J);
            spawnBurst(pos[k], pos[k + 1], 0, time);
            predFeedAt[p] = time;
            predPulseAt[p] = time;
            predTarget[p] = -1;
            predCatches++;
            caught[i] = 1;
            respawnAt[i] = time + 1000;   // 1 秒后重新出生
            birthAt[i] = -Infinity;
            stamina[i] = 0; sprintUntil[i] = 0;
            break;
          }
        }
      }

      // 延迟补位：1 秒后在离捕食者最远、离边界有余量的位置出生
      for (let i = 0; i < n; i++) {
        if (caught[i] && time >= respawnAt[i]) {
          spawnFar(i, time);
          caught[i] = 0; respawnAt[i] = 0;
          audio.birth();
        }
      }
      if (P > 0) prevFlee.set(fleeDir);   // 信息级联使用上一帧逃逸方向

      let spread = 0;
      for (let i = 0; i < n; i++) {
        if (caught[i]) continue;
        const k = i * 3;
        const dx = pos[k] - cx, dy = pos[k + 1] - cy;
        spread += dx * dx + dy * dy;
      }

      // 宏观量：数密度 ρ、动能温度 T、理想气体气压 P = ρT
      avgNeighbors = sumNeighbors / aliveN;
      const neighborDensity = Math.min(1, avgNeighbors / 45);
      const coherence = Math.max(0, 1 - Math.sqrt(spread / aliveN) / (B * 0.62));
      density = Math.min(1, neighborDensity * 0.72 + coherence * 0.28);
      avgSpeed = speedSum / aliveN;
      const vRef = THERMAL_REF;
      temperature = Math.min(1, (keSum / aliveN) / (0.5 * vRef * vRef));
      pressure = density * temperature;

      // 碰撞强度只作为统计保留，不再触发音效。
      collisionImpulse = Math.max(impact, boundaryImpact) / Math.pow(maxSpeed, 1.2);
    }

    // ---------------------------------------------------------------- 渲染
    let last = performance.now();
    let fps = 60, fpsAcc = 0, fpsFrames = 0, hudTimer = 0;

    function render(now) {
      requestAnimationFrame(render);
      const rawDt = (now - last) / 1000;
      last = now;
      const dt = Math.min(rawDt, 0.035);
      fpsAcc += rawDt; fpsFrames++;
      if (fpsAcc > 0.5) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; }

      if (!params.paused) step(dt, now);

      view2D.zoom += (view2D.tZoom - view2D.zoom) * 0.12;
      updateOrthoFrustum();
      camera.position.set(view2D.x, view2D.y, 40);
      camera.up.set(0, 1, 0);
      camera.lookAt(view2D.x, view2D.y, 0);

      // CPU 只写颜色/尺寸；箭头的朝向与形状全部交给 GPU 着色器。
      const n = activeCount;
      for (let i = 0; i < n; i++) {
        if (caught[i]) { siz[i] = 0; continue; }   // 等待重生的 1 秒完全隐藏
        const k = i * 3;
        const local = Math.min(1, neighbors[i] / 24);
        const speedRatio = Math.min(1, Math.hypot(vel[k], vel[k + 1], vel[k + 2]) / params.maxSpeed);
        tmpColor.setHSL(0.52 + local * 0.40, 0.95, 0.46 + speedRatio * 0.22);
        let size = params.arrowSize + local * 0.10;
        // 新生个体：亮绿色 + 轻微脉冲，1.8s 后开始渐变为普通色，3.2s 后完全一致。
        const age = now - birthAt[i];
        if (age >= 0 && age < BIRTH_TOTAL_MS) {
          const fade = Math.max(0, Math.min(1,
            (age - BIRTH_SOLID_MS) / (BIRTH_TOTAL_MS - BIRTH_SOLID_MS)));
          const pulse = 0.5 + 0.5 * Math.cos(Math.min(age, 700) * 0.014);
          const glow = 0.85 + 0.3 * pulse;
          col[k] = tmpColor.r * fade + tmpBirth.r * (1 - fade) * glow;
          col[k + 1] = tmpColor.g * fade + tmpBirth.g * (1 - fade) * glow;
          col[k + 2] = tmpColor.b * fade + tmpBirth.b * (1 - fade) * glow;
          size *= 1 + (1 - fade) * (0.28 + 0.12 * pulse);
        } else {
          col[k] = tmpColor.r; col[k + 1] = tmpColor.g; col[k + 2] = tmpColor.b;
        }
        // 爆发中：暖金色脉冲高亮 + 略微放大；新生绿色优先，不覆盖。
        if (now < sprintUntil[i] && age >= BIRTH_TOTAL_MS) {
          const flick = 0.72 + 0.20 * (0.5 + 0.5 * Math.sin(now * 0.022 + i));
          col[k] = col[k] * (1 - flick) + tmpSprint.r * flick;
          col[k + 1] = col[k + 1] * (1 - flick) + tmpSprint.g * flick;
          col[k + 2] = col[k + 2] * (1 - flick) + tmpSprint.b * flick;
          size *= 1.45;
        }
        siz[i] = size;
      }
      // 箭头朝向低通滤波：Boids 力在拥挤处会逐帧改变方向，直接画瞬时速度会抖动。
      // 只平滑用于渲染的速度，物理仿真仍使用原始 vel，行为不变。
      const SMOOTH = 0.18;   // 30 FPS 下时间常数约 0.15s，抖动明显降低且方向仍跟手
      for (let i = 0; i < n * 3; i++) rVel[i] += (vel[i] - rVel[i]) * SMOOTH;
      aPos.needsUpdate = true;
      aVel.needsUpdate = true;
      aCol.needsUpdate = true;
      aSiz.needsUpdate = true;

      // 捕食者：GPU 属性更新 + 威胁圈跟随相机
      predMesh.visible = params.predatorOn;
      if (params.predatorOn) {
        for (let i = 0; i < activeP * 3; i++) rPredVel[i] += (predVel[i] - rPredVel[i]) * SMOOTH;
        pPos.needsUpdate = true;
        pVel.needsUpdate = true;
        pCol.needsUpdate = true;
        pSiz.needsUpdate = true;
        for (let p = 0; p < MAX_P; p++) {
          const ring = threatRings[p];
          if (p >= activeP) { ring.visible = false; continue; }
          const k = p * 3;
          ring.position.set(predPos[k], predPos[k + 1], predPos[k + 2]);
          ring.quaternion.copy(camera.quaternion);
          ring.scale.setScalar(params.fleeRange);
          ring.visible = true;
          // 扑击瞬间箭头放大脉冲，与冲击波同步。
          const pulse = Math.max(0, 1 - (now - predPulseAt[p]) / 280);
          predSiz[p] = predBaseSize() * (1 + 0.32 * pulse);
        }
      } else {
        for (const ring of threatRings) ring.visible = false;
      }

      // 捕杀三段动画，节拍与 predate() 的三段音一致
      for (const b of killBursts) {
        if (!b.active) continue;
        const age = now - b.born;
        if (age >= BURST_MS) {
          b.active = false;
          for (const o of [b.core, b.inner, b.outer, b.sparks]) o.visible = false;
          continue;
        }
        // 第一段 0ms：亮核闪灭（撞击音）
        const cu = Math.min(1, age / 160);
        b.core.position.set(b.x, b.y, 0.3);
        b.core.quaternion.copy(camera.quaternion);
        b.core.scale.setScalar(0.25 + 1.35 * cu);
        b.core.material.opacity = Math.pow(1 - Math.min(1, age / 260), 2);

        // 第二段 90ms：内环扩张（撕裂音）
        const ia = age - 90;
        if (ia > 0) {
          const iu = Math.min(1, ia / 420);
          b.inner.position.set(b.x, b.y, 0.2);
          b.inner.quaternion.copy(camera.quaternion);
          b.inner.scale.setScalar(0.35 + 2.6 * (1 - Math.pow(1 - iu, 3)));
          b.inner.material.opacity = 0.85 * (1 - iu);
        } else b.inner.material.opacity = 0;

        // 第三段 240ms：外环余波（低沉尾音）
        const u = age / BURST_MS;
        const ease = 1 - Math.pow(1 - u, 3);
        b.outer.position.set(b.x, b.y, 0.1);
        b.outer.quaternion.copy(camera.quaternion);
        b.outer.scale.setScalar(0.5 + 5.0 * ease);
        b.outer.material.opacity = 0.75 * Math.pow(1 - u, 1.4);

        // 火花：随内环一起飞散
        const sa = age - 90;
        if (sa > 0 && sa < 560) {
          const su = sa / 560, se = 1 - Math.pow(1 - su, 2);
          const arr = b.sparks.geometry.attributes.position.array;
          for (let s = 0; s < SPARKS; s++) {
            const r = 0.4 + 5.2 * se;
            arr[s * 3] = b.x + b.dirs[s * 2] * r;
            arr[s * 3 + 1] = b.y + b.dirs[s * 2 + 1] * r;
            arr[s * 3 + 2] = 0.25;
          }
          b.sparks.geometry.attributes.position.needsUpdate = true;
          b.sparks.material.opacity = 0.9 * (1 - su);
          b.sparks.visible = true;
        } else b.sparks.visible = false;
      }

      renderer.render(scene, camera);

      sprintFlash = Math.max(0, sprintFlash - dt * 2.6);
      birthFlash = Math.max(0, birthFlash - dt * 2.6);
      predFlash = Math.max(0, predFlash - dt * 3);
      hudTimer += dt;
      if (hudTimer > 0.1) {
        hudTimer = 0;
        document.getElementById('hDensityBar').style.width = (density * 100).toFixed(0) + '%';
        document.getElementById('hTemp').textContent = temperature.toFixed(3);
        document.getElementById('hPress').textContent = pressure.toFixed(3);
        let recovering = 0;
        for (let i = 0; i < activeCount; i++) if (stamina[i] < 1) recovering++;
        document.getElementById('hSprint').textContent = sprintingCount + ' / ' + recovering;
        document.getElementById('hFps').textContent = Math.round(fps) + ' FPS';
        const fxOn = audio.enabled && !audio.muted;
        document.getElementById('hSprintFx').className = 'dot' + (fxOn && sprintFlash > 0.35 ? ' sprint' : '');
        document.getElementById('hPredFx').className = 'dot' + (fxOn && predFlash > 0.35 ? ' pred' : '');
        document.getElementById('hBirthFx').className = 'dot' + (fxOn && birthFlash > 0.35 ? ' birth' : '');
      }
    }

    addEventListener('resize', () => {
      updateOrthoFrustum();
      updateRectFrame();
      renderer.setSize(innerWidth, innerHeight);
    });

    updateRectFrame();
    requestAnimationFrame(render);

    window.FlockLab = {
      params, resetBoids, setCount, setPredCount, spawnBurst,
      get maxAbsZ() {
        let m = 0;
        for (let i = 0; i < activeCount; i++) m = Math.max(m, Math.abs(pos[i * 3 + 2]));
        return +m.toFixed(4);
      },
      get xyExtent() {
        let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
        for (let i = 0; i < activeCount; i++) {
          const k = i * 3;
          mnx = Math.min(mnx, pos[k]); mxx = Math.max(mxx, pos[k]);
          mny = Math.min(mny, pos[k + 1]); mxy = Math.max(mxy, pos[k + 1]);
        }
        return { x: [+mnx.toFixed(1), +mxx.toFixed(1)], y: [+mny.toFixed(1), +mxy.toFixed(1)] };
      },
      get view() { return { x: view2D.x, y: view2D.y, zoom: view2D.zoom }; },
      get displayRect() {
        const a = rectFrameGeo.attributes.position.array;
        return { hx: +a[3].toFixed(2), hy: +a[7].toFixed(2) };
      },
      get orthoHalfH() { return +((orthoCam.top - orthoCam.bottom) / 2).toFixed(2); },
      get count() { return activeCount; },
      get velocities() { return Array.from(vel.slice(0, activeCount * 3)); },
      get renderVelocities() { return Array.from(rVel.slice(0, activeCount * 3)); },
      get predatorCount() { return params.predatorOn ? activeP : 0; },
      get predatorPositions() {
        return Array.from({ length: params.predatorOn ? activeP : 0 }, (_, p) => ({
          x: +predPos[p * 3].toFixed(2), y: +predPos[p * 3 + 1].toFixed(2), z: +predPos[p * 3 + 2].toFixed(2)
        }));
      },
      get catches() { return predCatches; },
      get newbornCount() {
        const now = performance.now();
        let c = 0;
        for (let i = 0; i < activeCount; i++) if (now - birthAt[i] < BIRTH_TOTAL_MS) c++;
        return c;
      },
      get activeBursts() { return killBursts.filter((b) => b.active).length; },
      get sprintCount() { return sprintCount; },
      get sprintingCount() { return sprintingCount; },
      get recoveringCount() {
        let c = 0;
        for (let i = 0; i < activeCount; i++) if (stamina[i] < 1) c++;
        return c;
      },
      get avgStamina() {
        let s = 0;
        for (let i = 0; i < activeCount; i++) s += stamina[i];
        return +(s / activeCount).toFixed(3);
      },
      get sprintWindowMs() {
        let m = 0;
        const now = performance.now();
        for (let i = 0; i < activeCount; i++) m = Math.max(m, sprintUntil[i] - now);
        return Math.round(m);
      },
      get sprintDeadlines() { return Array.from(sprintUntil.slice(0, activeCount)); },
      get predatorTargets() {
        return Array.from({ length: params.predatorOn ? activeP : 0 }, (_, p) => predTarget[p]);
      },
      get predatorDrawCount() { return predGeo.instanceCount; },
      get muted() { return audio.muted; },
      get audioState() { return audio.ctx ? audio.ctx.state : null; },
      get masterGain() { return audio.master ? +audio.master.gain.value.toFixed(4) : null; },
      get audioOutputConnected() { return audio.outputConnected; },
      get soundEvents() { return { ...audio.total }; },
      get uiHidden() { return document.body.classList.contains('ui-hidden'); },
      get cursorHidden() { return document.body.classList.contains('cursor-idle'); },
      get eyeFaded() { return uiBtn.classList.contains('faded'); },
      get fleeingCount() { let c = 0; for (let i = 0; i < activeCount; i++) c += fleeing[i]; return c; },
      get groupCenter() { return { x: +groupX.toFixed(2), y: +groupY.toFixed(2), z: +groupZ.toFixed(2) }; },
      get avgPredDist() {
        if (!params.predatorOn) return 0;
        let sum = 0;
        for (let i = 0; i < activeCount; i++) {
          let best = Infinity;
          for (let p = 0; p < activeP; p++) {
            const k = i * 3, q = p * 3;
            const dx = pos[k] - predPos[q], dy = pos[k + 1] - predPos[q + 1], dz = pos[k + 2] - predPos[q + 2];
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 < best) best = d2;
          }
          sum += Math.sqrt(best);
        }
        return sum / activeCount;
      },
      get density() { return density; },
      get temperature() { return temperature; },
      get pressure() { return pressure; },
      get impulse() { return collisionImpulse; },
      get avgNeighbors() { return avgNeighbors; },
      get avgSpeed() { return +avgSpeed.toFixed(3); },
      get paceSpeed() { return +currentPace.toFixed(3); },
      get deadCount() { let c = 0; for (let i = 0; i < activeCount; i++) c += caught[i]; return c; },
      get respawnDelays() {
        const now = performance.now();
        return Array.from({ length: activeCount }, (_, i) => caught[i] ? Math.max(0, Math.round(respawnAt[i] - now)) : 0);
      },
      get catchRadius() { return +catchRadius().toFixed(2); },
      get predatorSpeeds() {
        return Array.from({ length: params.predatorOn ? activeP : 0 },
          (_, p) => +Math.hypot(predVel[p * 3], predVel[p * 3 + 1]).toFixed(2));
      },
      get positions() {
        return Array.from({ length: activeCount }, (_, i) => ({
          x: +pos[i * 3].toFixed(2), y: +pos[i * 3 + 1].toFixed(2),
          born: birthAt[i] === -Infinity ? 0 : Math.round(birthAt[i]),
          dead: !!caught[i]
        }));
      },
      get sprintSoundDuration() { return audio.lastSprintDur; }
    };
  </script>
</body>
</html>
